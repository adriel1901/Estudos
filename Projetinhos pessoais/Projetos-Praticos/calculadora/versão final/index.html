<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Versão Final da Calculadora</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>

<body>

    <main class="container" >
        <button class="botao-historico" data-modal="modal"></button>
        <div id="display" class="display">0</div>
        <div class="teclado">
            <button class="botoes blue" id="btnCE" >CE</button>
            <button class="botoes blue" id="btnC">C</button>
            <button class="botoes blue" id="btnPC">%</button>
            <button class="botoes blue" id="btnQD">x²</button>
            
            <button class="botoes dark-gray" id="btn7" value="7">7</button>
            <button class="botoes dark-gray" id="btn8" value="8">8</button>
            <button class="botoes dark-gray" id="btn9" value="9">9</button>
            <button class="botoes blue" id="btnDIV">/</button>

            <button class="botoes dark-gray" id="btn4" value="4">4</button>
            <button class="botoes dark-gray" id="btn5" value="5">5</button>
            <button class="botoes dark-gray" id="btn6" value="6">6</button>
            <button class="botoes blue" id="btnM">*</button>

            <button class="botoes dark-gray" id="btn1" value="1">1</button>
            <button class="botoes dark-gray" id="btn2" value="2">2</button>
            <button class="botoes dark-gray" id="btn3" value="3">3</button>
            <button class="botoes blue" id="btnSoma">+</button>

            <button class="botoes blue" id="btnRAIZ">√</button>
            <button class="botoes dark-gray" id="btn0" value="0">0</button>
            <button class="botoes blue" id="btnPONTO">.</button>
            <button class="botoes orange" id="btnIGUAL">=</button>
        </div>
    </main>

</body>
<script src="index.js"></script>

</html>
